# Optional convenience — the app runs fine without Docker:
#   backend:  pip install -r requirements.txt && uvicorn app.main:app --reload
#   frontend: npm install && npm run dev
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/uploads:/app/uploads
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
